[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codesmith-local"
version = "0.1.0"
description = "An OpenRouter-powered repository coding assistant"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests==2.31.0",
    "Pygments==2.17.0",
    "prompt-toolkit==3.0.52",
    "colorama==0.4.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9",
]

[project.scripts]
codesmith = "codesmith.cli:main"
codesmith-batch = "codesmith.batch:main"

[tool.setuptools.packages.find]
where = ["src"]
